
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supporter Registration | Desert Warriors FC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f2;
            color: #222;
        }

        .register-container {
            width: 90%;
            max-width: 460px;
            margin: 55px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #176b35;
            margin-bottom: 8px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #176b35;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 5px;
            background: #176b35;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #105329;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #176b35;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">
        <h1>Join Desert Warriors FC</h1>

        <p class="intro">
            Register as a supporter and become part of our football family.
        </p>

        <form id="register-form">

            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                required
                autocomplete="name"
                placeholder="Enter your full name"
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                required
                autocomplete="tel"
                placeholder="e.g. 0712345678"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                placeholder="Enter your email address"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="At least 8 characters"
            >

            <button type="submit" id="register-button">
                Create Account
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./supabaseClient.js";

        const form = document.getElementById("register-form");
        const message = document.getElementById("message");
        const button = document.getElementById("register-button");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const fullName = document.getElementById("full_name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!fullName || !phone || !email || !password) {
                message.textContent = "Please complete all fields.";
                return;
            }

            if (password.length < 8) {
                message.textContent = "Your password must have at least 8 characters.";
                return;
            }

            button.disabled = true;
            button.textContent = "Creating account...";
            message.textContent = "";

            try {
                 const { data, error } = await supabase.auth.signUp({
                email: email,
                 password: password,
                 options: {
                 emailRedirectTo: "http://127.0.0.1:5500/login.html",
                 data: {
                    full_name: fullName,
                    phone: phone
                }
               }
           });

                if (error) {
                    throw error;
                }

                if (data.session) {
                    message.textContent =
                        "Your account has been created successfully. You can now log in.";
                } else {
                    message.textContent =
                        "Registration successful! Please check your email and confirm your account before logging in.";
                }

                form.reset();

            } catch (error) {
                message.textContent = "Registration failed: " + error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
