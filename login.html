
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supporter Login | Desert Warriors FC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f2;
            color: #222;
        }

        .login-container {
            width: 90%;
            max-width: 450px;
            margin: 65px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #176b35;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 5px;
            background: #176b35;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #105329;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #176b35;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back!</h1>

        <p class="intro">
            Login to your Desert Warriors FC supporter account.
        </p>

        <form id="login-form">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="login-button">
                Login
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </div>

    </div>

    <script type="module">

        import { supabase } from "./supabaseClient.js";

        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            button.disabled = true;
            button.textContent = "Logging in...";
            message.textContent = "";

            try {

                const { data, error } =
                    await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    throw error;
                }

                message.textContent = "Login successful! Welcome to Desert Warriors FC.";

                window.location.href = "dashboard.html";

            } catch (error) {

                message.textContent = "Login failed: " + error.message;

            } finally {

                button.disabled = false;
                button.textContent = "Login";

            }

        });

    </script>

</body>
</html>
